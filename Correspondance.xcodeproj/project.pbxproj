			shellPath = /bin/sh;
			shellScript = "set -e\nAPP=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}\"\nmkdir -p \"$APP/MacOS\" \"$APP/Library/LaunchAgents\"\ncp -f \"${SRCROOT}/Correspondance/Resources/LaunchAgents/app.correspondance.agent.plist\" \\\n  \"$APP/Library/LaunchAgents/app.correspondance.agent.plist\"\n# Le binaire vient du paquet Swift. On le construit dans un dossier à\n# part pour ne pas mêler ses artefacts à ceux d'Xcode.\nBUILD_DIR=\"${SRCROOT}/Packages/CorrespondanceCore/.build-agent\"\nSWIFT_CONF=$([ \"${CONFIGURATION}\" = \"Release\" ] && echo release || echo debug)\n# Un échec de construction FAIT ÉCHOUER LE BUILD. Auparavant on\n# sortait en 0 avec un simple « warning » : l'app gardait alors le\n# binaire précédent, Xcode affichait BUILD SUCCEEDED, et on testait du\n# vieux code sans le savoir. Un binaire périmé qui a l'air frais coûte\n# des heures — une build rouge en coûte cinq minutes.\nif ! xcrun swift build --package-path \"${SRCROOT}/Packages/CorrespondanceCore\" \\\n      --product correspondance-agent -c \"$SWIFT_CONF\" \\\n      --scratch-path \"$BUILD_DIR\" > /tmp/correspondance-agent-build.log 2>&1; then\n  echo \"error: correspondance-agent n'a pas pu être construit — l'app embarquerait un binaire périmé\"\n  tail -20 /tmp/correspondance-agent-build.log\n  exit 1\nfi\nBIN=$(xcrun swift build --package-path \"${SRCROOT}/Packages/CorrespondanceCore\" \\\n      --product correspondance-agent -c \"$SWIFT_CONF\" --scratch-path \"$BUILD_DIR\" \\\n      --show-bin-path 2>/dev/null)/correspondance-agent\nif [ -f \"$BIN\" ]; then\n  cp -f \"$BIN\" \"$APP/MacOS/correspondance-agent\"\n  echo \"Embedded agent: $BIN\"\nelse\n  echo \"error: binaire de l'agent introuvable ($BIN)\"\n  exit 1\nfi\n";
		};
