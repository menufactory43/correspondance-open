name: Correspondance
options:
  bundleIdPrefix: app.correspondance
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.Correspondance
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Correspondance
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Correspondance"
    ENABLE_HARDENED_RUNTIME: YES
    # Signature stable (Team ID) → Accès disque survit aux rebuilds.
    # L’adhoc (« Sign to Run Locally ») change de CDHash à chaque build → TCC oublié.
    DEVELOPMENT_TEAM: AKMNXGVVGX
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  CorrespondanceCore:
    path: Packages/CorrespondanceCore

targets:
  Correspondance:
    type: application
    platform: macOS
    sources:
      - path: Correspondance
        excludes:
          - Resources/**
          - Info.plist
      # Payloads /sync de démonstration, les mêmes que l'iPhone (cf. DemoMode.swift).
      - path: CorrespondanceiOS/Demo
        buildPhase: resources
    resources:
      # xcassets à la racine projet — évite le conflit avec sources excludes Resources/**
      - path: Assets.xcassets
      - path: Correspondance/Resources/AppIcon.icns
      - path: Correspondance/Resources/Fonts
        type: folder
        buildPhase: resources
    postCompileScripts:
      - name: Embed Resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST_FONTS="${RES}/Fonts"
          mkdir -p "$DEST_FONTS"
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.ttf "$DEST_FONTS/" 2>/dev/null || true
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.md "$DEST_FONTS/" 2>/dev/null || true
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.txt "$DEST_FONTS/" 2>/dev/null || true
          # Icône Dock / Finder (secours si Assets.car absent)
          if [ -f "${SRCROOT}/Correspondance/Resources/AppIcon.icns" ]; then
            cp -f "${SRCROOT}/Correspondance/Resources/AppIcon.icns" "${RES}/AppIcon.icns"
          fi
          echo "Embedded fonts + AppIcon.icns into $RES"
          ls -la "$RES" || true
          ls -la "$DEST_FONTS" || true
      # L'agent embarqué : le binaire dans Contents/MacOS, son plist dans
      # Contents/Library/LaunchAgents — SMAppService ne le cherche que là.
      # C'est ce qui rend « Activer cc » possible sans SSH ni Docker.
      - name: Embed correspondance-agent
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "$APP/MacOS" "$APP/Library/LaunchAgents"
          cp -f "${SRCROOT}/Correspondance/Resources/LaunchAgents/app.correspondance.agent.plist" \
            "$APP/Library/LaunchAgents/app.correspondance.agent.plist"
          # Le binaire vient du paquet Swift. On le construit dans un dossier à
          # part pour ne pas mêler ses artefacts à ceux d'Xcode.
          BUILD_DIR="${SRCROOT}/Packages/CorrespondanceCore/.build-agent"
          SWIFT_CONF=$([ "${CONFIGURATION}" = "Release" ] && echo release || echo debug)
          # Un échec de construction FAIT ÉCHOUER LE BUILD. Auparavant on
          # sortait en 0 avec un simple « warning » : l'app gardait alors le
          # binaire précédent, Xcode affichait BUILD SUCCEEDED, et on testait du
          # vieux code sans le savoir. Un binaire périmé qui a l'air frais coûte
          # des heures — une build rouge en coûte cinq minutes.
          if ! xcrun swift build --package-path "${SRCROOT}/Packages/CorrespondanceCore" \
                --product correspondance-agent -c "$SWIFT_CONF" \
                --scratch-path "$BUILD_DIR" > /tmp/correspondance-agent-build.log 2>&1; then
            echo "error: correspondance-agent n'a pas pu être construit — l'app embarquerait un binaire périmé"
            tail -20 /tmp/correspondance-agent-build.log
            exit 1
          fi
          BIN=$(xcrun swift build --package-path "${SRCROOT}/Packages/CorrespondanceCore" \
                --product correspondance-agent -c "$SWIFT_CONF" --scratch-path "$BUILD_DIR" \
                --show-bin-path 2>/dev/null)/correspondance-agent
          if [ -f "$BIN" ]; then
            cp -f "$BIN" "$APP/MacOS/correspondance-agent"
            # Signé à part, runtime durci : la notarisation refuse un exécutable
            # imbriqué sans lui (« does not have the hardened runtime enabled »),
            # et l'export Developer ID ne rajoute pas le drapeau qu'il n'a pas trouvé.
            IDENTITE="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-${CODE_SIGN_IDENTITY:--}}"
            codesign --force --options runtime --timestamp=none \
              --sign "$IDENTITE" "$APP/MacOS/correspondance-agent" 2>/dev/null \
              || codesign --force --options runtime --sign - "$APP/MacOS/correspondance-agent"
            echo "Embedded agent: $BIN"
          else
            echo "error: binaire de l'agent introuvable ($BIN)"
            exit 1
          fi
      # Le mandataire Tailcat, embarqué plutôt que téléchargé.
      #
      # Pourquoi embarquer. Un binaire téléchargé à l'exécution arriverait en
      # quarantaine, non signé, hors du sceau de l'app — c'est-à-dire hors de la
      # notarisation, et à la merci de qui tient le réseau au moment précis où
      # l'on ouvre un chemin réseau. Embarqué, il est signé avec l'app, il
      # marche hors ligne, et « ce que l'app lance » est exactement « ce qui a
      # été notarisé ».
      #
      # Il vient de ~/unclic-publication, construit par
      # `infra/relais/construire.sh --quoi tailcat` au tag épinglé : cette phase
      # ne construit rien, elle copie. Absent, elle n'échoue PAS — une build de
      # développement doit rester possible sans lui — et l'app le dit à l'écran
      # (« tailcat n'est pas dans ce bundle »).
      - name: Embed tailcat
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}"
          SRC_BIN="${CORRESPONDANCE_PUBLICATION:-$HOME/unclic-publication}/tailcat-darwin-arm64"
          if [ ! -f "$SRC_BIN" ]; then
            echo "warning: tailcat-darwin-arm64 absent — l'app dira « tailcat n'est pas dans ce bundle » (bash infra/relais/construire.sh --quoi tailcat)"
            rm -f "$APP/Helpers/tailcat"
            exit 0
          fi
          mkdir -p "$APP/Helpers"
          cp -f "$SRC_BIN" "$APP/Helpers/tailcat"
          chmod 755 "$APP/Helpers/tailcat"
          # Un exécutable imbriqué se signe SÉPARÉMENT : la signature de l'app
          # ne fait que le sceller. Sans ça, une build notarisée porterait un
          # binaire « not signed at all » et Gatekeeper refuserait l'app
          # entière — pas seulement le mandataire.
          IDENTITE="${EXPANDED_CODE_SIGN_IDENTITY_NAME:-${CODE_SIGN_IDENTITY:--}}"
          codesign --force --options runtime --timestamp=none \
            --sign "$IDENTITE" "$APP/Helpers/tailcat" 2>/dev/null \
            || codesign --force --options runtime --sign - "$APP/Helpers/tailcat"
          echo "Embedded tailcat: $SRC_BIN → $APP/Helpers/tailcat"
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
      - package: CorrespondanceCore
        product: CorrespondanceUI
      # Le contrat de sortie de l'agent (`AgentExit`) : le surveillant a besoin
      # de savoir quelles chutes se relancent et lesquelles ne se réparent pas
      # toutes seules. Un contrat partagé, jamais recopié.
      - package: CorrespondanceCore
        product: CorrespondanceAgentKit
      # L'extension de partage (Finder, Safari, Photos → une personne). Elle
      # voyage dans l'app, comme celle des notifications sur iPhone.
      - target: CorrespondancePartage
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.Correspondance
        PRODUCT_NAME: Correspondance
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Correspondance/Info.plist
        CODE_SIGN_ENTITLEMENTS: Correspondance/Correspondance.entitlements
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Une build Release locale ne porte que l'architecture de la machine :
        # la tranche x86_64 d'un binaire universel coûtait ~20 ms avant `main`
        # (mesuré en blocs alternés, `tools/launch`). Une archive de
        # distribution ignore ce réglage et reste universelle.
        Release:
          ONLY_ACTIVE_ARCH: YES
    info:
      path: Correspondance/Info.plist
      properties:
        CFBundleName: Correspondance
        CFBundleDisplayName: Correspondance
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: Fonts
        NSAppleEventsUsageDescription: Correspondance envoie tes iMessages via l’app Messages (automatisation).
        NSContactsUsageDescription: Correspondance affiche les noms et photos de vos contacts iMessage dans la sidebar.
        NSMicrophoneUsageDescription: Correspondance utilise le micro pour dicter vos messages et enregistrer vos messages vocaux.
        NSSpeechRecognitionUsageDescription: Correspondance convertit votre dictée en texte dans le composer.
        # `correspondance://partage` : l'extension de partage a déposé, et
        # réveille l'app pour qu'elle envoie (cf. Partage.urlDeReveil).
        CFBundleURLTypes:
          - CFBundleURLName: app.correspondance.Correspondance
            CFBundleURLSchemes: [correspondance]
        # UserNotifications ne demande AUCUNE clé d'usage sur macOS : l'autorisation
        # se demande à l'exécution (NotificationService.requestAuthorization). Ne rien
        # ajouter ici pour les notifications — et jamais rien dans Info.plist, régénéré.
        # Homeserver Matrix privé en HTTP clair sur le tailnet (Synapse sur le NUC). Pas d'IP : ATS n'accepte que des hôtes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            # Le nom magique du mandataire Tailcat. Le trafic y est en HTTP
            # clair, mais il ne quitte jamais la machine en clair : il entre
            # dans un tunnel WireGuard chiffré de bout en bout avant le premier
            # octet sur le réseau. Sans cette exception, ATS refuse la requête
            # avec « requires the use of a secure connection » et l'écran dit
            # « le homeserver ne répond pas » — il accuse le Relais d'une panne
            # qui n'est pas la sienne. Écrite ICI et pas dans l'Info.plist :
            # xcodegen réengendre ce fichier, et la phase 7a l'avait perdue.
            server.tailcat:
              NSExceptionAllowsInsecureHTTPLoads: true
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  CorrespondanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CorrespondanceTests
        excludes:
          - Fixtures/**
      # `resources:` n'existe pas chez xcodegen : une ressource est une source
      # avec `buildPhase: resources` (fixtures chargées via `Bundle(for:)`).
      - path: CorrespondanceTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Correspondance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.CorrespondanceTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Correspondance.app/Contents/MacOS/Correspondance"
        BUNDLE_LOADER: "$(TEST_HOST)"


  Correspondance iOS:
    type: application
    platform: iOS
    sources:
      - path: CorrespondanceiOS
        excludes:
          - Demo/**
      # Payloads /sync de démonstration (les fixtures de Core) : ce sont des
      # ressources, pas des sources. Cf. CorrespondanceiOS/Store/DemoRelay.swift.
      - path: CorrespondanceiOS/Demo
        buildPhase: resources
      # Les mêmes fontes que sur le Mac (iA Writer S, IBM Plex — OFL).
      - path: Correspondance/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
      - package: CorrespondanceCore
        product: CorrespondanceUI
      # L'extension voyage DANS l'app : sans `embed`, elle se construit mais
      # n'arrive jamais sur l'appareil, et le push n'a plus de visage.
      - target: CorrespondanceiOSNotificationService
        embed: true
        codeSign: true
      - target: CorrespondanceiOSPartage
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios
        PRODUCT_NAME: Correspondance
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # L'icône iOS : la même image que le Mac, en 1024 sans alpha, dans
        # CorrespondanceiOS/Assets.xcassets. Sans elle, App Store Connect refuse
        # le build (90713, CFBundleIconName manquant).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        # Signature ad-hoc, et non « pas de signature » : sans elle le simulateur
        # n'applique AUCUN entitlement — donc ni groupe d'app, ni Trousseau
        # partagé, donc une extension de notification muette. Le simulateur
        # accepte l'ad-hoc sans profil d'approvisionnement ; l'appareil, lui,
        # reprendra la signature automatique de l'équipe.
        # Signature automatique : Xcode est connecté à l'équipe (2 sept. 2026), et
        # c'est elle qui a créé l'App Group `group.com.correspondance` chez Apple
        # et régénéré les profils. Les profils manuels « Correspondance iOS Dev »
        # et « … NSE Dev » sont invalides depuis (le groupe les a périmés).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: CorrespondanceiOS/CorrespondanceiOS.entitlements
        # Sans ce OUI, Xcode signe la build de simulateur avec un dictionnaire
        # d'entitlements VIDE — le fichier ci-dessus n'est même pas lu.
        ENTITLEMENTS_REQUIRED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondanceiOS/Info.plist
    info:
      path: CorrespondanceiOS/Info.plist
      properties:
        # Versions tirées du projet : sans ces deux lignes xcodegen écrit « 1.0 » et
        # « 1 » en dur, et App Store Connect refuse chaque envoi après le premier
        # (« bundle version must be higher »).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Déclaration d'export : le chiffrement de bout en bout de Correspondance
        # repose sur des algorithmes standard (Curve25519, AES-256 via
        # matrix-sdk-crypto), le cas exempté d'Apple. Sans cette clé, TestFlight
        # bloque chaque build sur « Missing Compliance ».
        ITSAppUsesNonExemptEncryption: false
        CFBundleName: Correspondance
        CFBundleDisplayName: Correspondance
        # Notifications de conversation : la photo de la personne à la place de
        # l'icône de l'app (cf. CorrespondanceiOS/Notifications). Sans cette
        # clé, `updating(from:)` rend la notification inchangée, sans un mot.
        NSUserActivityTypes:
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: com.correspondance.ios
            CFBundleURLSchemes: [correspondance]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Les fontes embarquées, comme ATSApplicationFontsPath côté Mac.
        UIAppFonts:
          - Fonts/iAWriterQuattroS-Regular.ttf
          - Fonts/iAWriterQuattroS-Italic.ttf
          - Fonts/iAWriterDuoS-Regular.ttf
          - Fonts/iAWriterDuoS-Italic.ttf
          - Fonts/iAWriterMonoS-Regular.ttf
          - Fonts/iAWriterMonoS-Italic.ttf
          - Fonts/IBMPlexSerif-Regular.ttf
          - Fonts/IBMPlexSerif-Italic.ttf
          - Fonts/IBMPlexSans-Regular.ttf
          - Fonts/IBMPlexSans-Italic.ttf
        NSContactsUsageDescription: Correspondance retrouve vos contacts pour écrire à quelqu’un qui n’a pas encore de conversation, et pour nommer les fils et les membres d’un groupe que le réseau ne désigne que par un numéro.
        NSPhotoLibraryUsageDescription: Correspondance joint vos photos à vos messages.
        NSCameraUsageDescription: Correspondance prend une photo pour la joindre à un message.
        NSMicrophoneUsageDescription: Correspondance utilise le micro pour vos messages vocaux.
        NSSpeechRecognitionUsageDescription: Correspondance transcrit les messages vocaux pour que vous puissiez les lire.
        # ATS ouvert, et PAS de NSAllowsLocalNetworking — décision 6 de
        # docs/PRODUCT.md § « Révision iOS ».
        #
        # Le Relais est un homeserver privé en HTTP clair, joint par Tailscale ;
        # son adresse est une CONFIGURATION, inconnue à la compilation, donc
        # aucune liste d'exceptions ne peut la couvrir. Deux faits mesurés sur
        # le simulateur iOS 26.3 (sonde URLSession, code -1022 = refus ATS) :
        #
        # 1. NSAllowsLocalNetworking NE COUVRE PAS le tailnet. Il exempte
        #    RFC1918 (192.168/16 : passe) et « .local » (passe), mais une
        #    adresse CGNAT 100.64/10 — celle que Tailscale attribue — est
        #    REFUSÉE (-1022). Elle n'est pas « locale » aux yeux d'ATS.
        # 2. NSAllowsLocalNetworking ANNULE NSAllowsArbitraryLoads. C'est la
        #    règle de rétrocompatibilité d'Apple : sur un système qui connaît
        #    les clés récentes, ArbitraryLoads est ignoré dès que l'une d'elles
        #    est là. Les deux ensemble — ce qu'on avait — refusaient donc 100.x.
        #
        # NSExceptionDomains, lui, n'annule rien : le tailnet reste nommé pour
        # la journée où l'exception suffira (exposition publique = HTTPS, ADR 0001).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  CorrespondanceiOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: CorrespondanceiOSNotificationService
        excludes:
          - Info.plist
      # Partagé avec l'app : la notification locale et le push distant doivent
      # dessiner la même personne de la même façon.
      - path: CorrespondanceiOS/Notifications/CommunicationNotification.swift
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
    settings:
      base:
        # L'identifiant de l'extension DOIT préfixer par celui de l'app.
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios.NotificationService
        PRODUCT_NAME: CorrespondanceiOSNotificationService
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondanceiOSNotificationService/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: CorrespondanceiOSNotificationService/CorrespondanceiOSNotificationService.entitlements
        ENTITLEMENTS_REQUIRED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SKIP_INSTALL: YES

  # L'extension de partage iPhone : Photos, Safari, Fichiers → une personne.
  # Elle envoie elle-même au Relais (session du Trousseau partagé), et dépose
  # dans le conteneur du groupe quand il ne répond pas. Cf. Partage.swift.
  CorrespondanceiOSPartage:
    type: app-extension
    platform: iOS
    sources:
      - path: CorrespondanceiOSPartage
        excludes:
          - Info.plist
      # La feuille elle-même, la même sur Mac.
      - path: Partage
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios.Partage
        PRODUCT_NAME: CorrespondanceiOSPartage
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondanceiOSPartage/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: CorrespondanceiOSPartage/CorrespondanceiOSPartage.entitlements
        ENTITLEMENTS_REQUIRED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SKIP_INSTALL: YES

  # L'extension de partage Mac : Finder, Safari, Photos → une personne. Elle
  # dépose toujours et réveille l'app : une extension Mac est sandboxée, et
  # iMessage ne part que par Messages, que seule l'app sait piloter.
  CorrespondancePartage:
    type: app-extension
    platform: macOS
    sources:
      - path: CorrespondancePartage
        excludes:
          - Info.plist
      - path: Partage
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.Correspondance.Partage
        PRODUCT_NAME: CorrespondancePartage
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondancePartage/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: CorrespondancePartage/CorrespondancePartage.entitlements
        SKIP_INSTALL: YES

  CorrespondanceiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CorrespondanceiOSUITests
    dependencies:
      - target: Correspondance iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Correspondance iOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Correspondance:
    build:
      targets:
        Correspondance: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorrespondanceTests
  Correspondance iOS:
    build:
      targets:
        Correspondance iOS: all
        CorrespondanceiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorrespondanceiOSUITests
