name: Correspondance
options:
  bundleIdPrefix: app.correspondance
  deploymentTarget:
    macOS: "14.0"
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.Correspondance
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Correspondance
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © Correspondance"
    ENABLE_HARDENED_RUNTIME: YES
    # Signature stable (Team ID) → Accès disque survit aux rebuilds.
    # L’adhoc (« Sign to Run Locally ») change de CDHash à chaque build → TCC oublié.
    DEVELOPMENT_TEAM: AKMNXGVVGX
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  CorrespondanceCore:
    path: Packages/CorrespondanceCore

targets:
  Correspondance:
    type: application
    platform: macOS
    sources:
      - path: Correspondance
        excludes:
          - Resources/**
          - Info.plist
    resources:
      # xcassets à la racine projet — évite le conflit avec sources excludes Resources/**
      - path: Assets.xcassets
      - path: Correspondance/Resources/AppIcon.icns
      - path: Correspondance/Resources/Fonts
        type: folder
        buildPhase: resources
    postCompileScripts:
      - name: Embed Resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST_FONTS="${RES}/Fonts"
          mkdir -p "$DEST_FONTS"
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.ttf "$DEST_FONTS/" 2>/dev/null || true
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.md "$DEST_FONTS/" 2>/dev/null || true
          cp -f "${SRCROOT}/Correspondance/Resources/Fonts/"*.txt "$DEST_FONTS/" 2>/dev/null || true
          # Icône Dock / Finder (secours si Assets.car absent)
          if [ -f "${SRCROOT}/Correspondance/Resources/AppIcon.icns" ]; then
            cp -f "${SRCROOT}/Correspondance/Resources/AppIcon.icns" "${RES}/AppIcon.icns"
          fi
          echo "Embedded fonts + AppIcon.icns into $RES"
          ls -la "$RES" || true
          ls -la "$DEST_FONTS" || true
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
      - package: CorrespondanceCore
        product: CorrespondanceUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.Correspondance
        PRODUCT_NAME: Correspondance
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Correspondance/Info.plist
        CODE_SIGN_ENTITLEMENTS: Correspondance/Correspondance.entitlements
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    info:
      path: Correspondance/Info.plist
      properties:
        CFBundleName: Correspondance
        CFBundleDisplayName: Correspondance
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        ATSApplicationFontsPath: Fonts
        NSAppleEventsUsageDescription: Correspondance envoie tes iMessages via l’app Messages (automatisation).
        NSContactsUsageDescription: Correspondance affiche les noms et photos de vos contacts iMessage dans la sidebar.
        NSMicrophoneUsageDescription: Correspondance utilise le micro pour dicter vos messages.
        NSSpeechRecognitionUsageDescription: Correspondance convertit votre dictée en texte dans le composer.
        # UserNotifications ne demande AUCUNE clé d'usage sur macOS : l'autorisation
        # se demande à l'exécution (NotificationService.requestAuthorization). Ne rien
        # ajouter ici pour les notifications — et jamais rien dans Info.plist, régénéré.
        # Homeserver Matrix privé en HTTP clair sur le tailnet (Synapse sur le NUC). Pas d'IP : ATS n'accepte que des hôtes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  CorrespondanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CorrespondanceTests
        excludes:
          - Fixtures/**
      # `resources:` n'existe pas chez xcodegen : une ressource est une source
      # avec `buildPhase: resources` (fixtures chargées via `Bundle(for:)`).
      - path: CorrespondanceTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Correspondance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.correspondance.CorrespondanceTests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Correspondance.app/Contents/MacOS/Correspondance"
        BUNDLE_LOADER: "$(TEST_HOST)"


  Correspondance iOS:
    type: application
    platform: iOS
    sources:
      - path: CorrespondanceiOS
        excludes:
          - Demo/**
      # Payloads /sync de démonstration (les fixtures de Core) : ce sont des
      # ressources, pas des sources. Cf. CorrespondanceiOS/Store/DemoRelay.swift.
      - path: CorrespondanceiOS/Demo
        buildPhase: resources
      # Les mêmes fontes que sur le Mac (iA Writer S, IBM Plex — OFL).
      - path: Correspondance/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
      - package: CorrespondanceCore
        product: CorrespondanceUI
      # L'extension voyage DANS l'app : sans `embed`, elle se construit mais
      # n'arrive jamais sur l'appareil, et le push n'a plus de visage.
      - target: CorrespondanceiOSNotificationService
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios
        PRODUCT_NAME: Correspondance
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: NO
        # Signature ad-hoc, et non « pas de signature » : sans elle le simulateur
        # n'applique AUCUN entitlement — donc ni groupe d'app, ni Trousseau
        # partagé, donc une extension de notification muette. Le simulateur
        # accepte l'ad-hoc sans profil d'approvisionnement ; l'appareil, lui,
        # reprendra la signature automatique de l'équipe.
        # Signature manuelle : Xcode n'est pas connecté au compte de l'équipe sur
        # cette machine, l'automatique échoue (« No Account for Team »). Les
        # profils ont été créés via `asc profiles create` (certificat de
        # développement UK59778D9M, iPhone 16 Pro) et installés dans
        # ~/Library/Developer/Xcode/UserData/Provisioning Profiles.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "Correspondance iOS Dev"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: CorrespondanceiOS/CorrespondanceiOS.entitlements
        # Sans ce OUI, Xcode signe la build de simulateur avec un dictionnaire
        # d'entitlements VIDE — le fichier ci-dessus n'est même pas lu.
        ENTITLEMENTS_REQUIRED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondanceiOS/Info.plist
    info:
      path: CorrespondanceiOS/Info.plist
      properties:
        CFBundleName: Correspondance
        CFBundleDisplayName: Correspondance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Les fontes embarquées, comme ATSApplicationFontsPath côté Mac.
        UIAppFonts:
          - Fonts/iAWriterQuattroS-Regular.ttf
          - Fonts/iAWriterQuattroS-Italic.ttf
          - Fonts/iAWriterDuoS-Regular.ttf
          - Fonts/iAWriterDuoS-Italic.ttf
          - Fonts/iAWriterMonoS-Regular.ttf
          - Fonts/iAWriterMonoS-Italic.ttf
          - Fonts/IBMPlexSerif-Regular.ttf
          - Fonts/IBMPlexSerif-Italic.ttf
          - Fonts/IBMPlexSans-Regular.ttf
          - Fonts/IBMPlexSans-Italic.ttf
        NSPhotoLibraryUsageDescription: Correspondance joint vos photos à vos messages.
        NSCameraUsageDescription: Correspondance prend une photo pour la joindre à un message.
        NSMicrophoneUsageDescription: Correspondance utilise le micro pour vos messages vocaux.
        NSSpeechRecognitionUsageDescription: Correspondance transcrit les messages vocaux pour que vous puissiez les lire.
        # ATS ouvert, et PAS de NSAllowsLocalNetworking — décision 6 de
        # docs/PRODUCT.md § « Révision iOS ».
        #
        # Le Relais est un homeserver privé en HTTP clair, joint par Tailscale ;
        # son adresse est une CONFIGURATION, inconnue à la compilation, donc
        # aucune liste d'exceptions ne peut la couvrir. Deux faits mesurés sur
        # le simulateur iOS 26.3 (sonde URLSession, code -1022 = refus ATS) :
        #
        # 1. NSAllowsLocalNetworking NE COUVRE PAS le tailnet. Il exempte
        #    RFC1918 (192.168/16 : passe) et « .local » (passe), mais une
        #    adresse CGNAT 100.64/10 — celle que Tailscale attribue — est
        #    REFUSÉE (-1022). Elle n'est pas « locale » aux yeux d'ATS.
        # 2. NSAllowsLocalNetworking ANNULE NSAllowsArbitraryLoads. C'est la
        #    règle de rétrocompatibilité d'Apple : sur un système qui connaît
        #    les clés récentes, ArbitraryLoads est ignoré dès que l'une d'elles
        #    est là. Les deux ensemble — ce qu'on avait — refusaient donc 100.x.
        #
        # NSExceptionDomains, lui, n'annule rien : le tailnet reste nommé pour
        # la journée où l'exception suffira (exposition publique = HTTPS, ADR 0001).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true

  CorrespondanceiOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: CorrespondanceiOSNotificationService
        excludes:
          - Info.plist
    dependencies:
      - package: CorrespondanceCore
        product: CorrespondanceCore
    settings:
      base:
        # L'identifiant de l'extension DOIT préfixer par celui de l'app.
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios.NotificationService
        PRODUCT_NAME: CorrespondanceiOSNotificationService
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CorrespondanceiOSNotificationService/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: AKMNXGVVGX
        CODE_SIGN_IDENTITY: "Apple Development"
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "Correspondance iOS NSE Dev"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: CorrespondanceiOSNotificationService/CorrespondanceiOSNotificationService.entitlements
        ENTITLEMENTS_REQUIRED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        SKIP_INSTALL: YES

  CorrespondanceiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CorrespondanceiOSUITests
    dependencies:
      - target: Correspondance iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.correspondance.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Correspondance iOS
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  Correspondance:
    build:
      targets:
        Correspondance: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorrespondanceTests
  Correspondance iOS:
    build:
      targets:
        Correspondance iOS: all
        CorrespondanceiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CorrespondanceiOSUITests
