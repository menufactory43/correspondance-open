# Correspondance — pile Matrix sur le NUC (Debian 12, docker-compose 1.29 → schéma v3.x).
# Bind sur l'IP Tailscale uniquement : 80/443 sont pris par Umbrel et le NUC est sur le LAN maison.
# Schéma 3.9 et non 3.8 pour `profiles`, seule façon de déclarer un service que
# `docker-compose up -d` ne démarre PAS de lui-même (le tunnel de la passerelle,
# qui n'a de sens que si un jeton existe). Vérifié sur le NUC : 1.29.2 l'accepte.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: correspondance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      # Synapse exige C/C.UTF-8 pour le collationnement.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - matrix

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: correspondance-synapse
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data/synapse:/data
    ports:
      # Jamais 0.0.0.0 — uniquement l'interface Tailscale.
      - "${SYNAPSE_BIND_IP}:8008:8008"
    networks:
      - matrix

  mautrix-whatsapp:
    # Tag épinglé : v26.08 introduit les ghosts LID — le parsing côté Swift en dépend.
    image: dock.mau.dev/mautrix/whatsapp:v26.08
    container_name: correspondance-mautrix-whatsapp
    restart: unless-stopped
    depends_on:
      - synapse
      - postgres
    environment:
      # L'entrypoint démarre root, chown /data puis su-exec vers cet UID (celui de `meff`).
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data/mautrix-whatsapp:/data
    networks:
      - matrix

  mautrix-meta:
    # Tag épinglé, préfixe `ig-` : depuis v26.08 mautrix-meta ne fait plus que Messenger,
    # Instagram est passé au binaire mautrix-instagram, publié sur la même image.
    image: dock.mau.dev/mautrix/meta:ig-v26.08
    container_name: correspondance-mautrix-meta
    restart: unless-stopped
    depends_on:
      - synapse
      - postgres
    environment:
      # Même entrypoint que WhatsApp : chown /data puis su-exec vers l'UID de `meff`.
      # (Le binaire s'appelle encore /usr/bin/mautrix-meta dans l'image `ig-`, mais c'est
      # bien mautrix-instagram : `--version` le dit.)
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data/mautrix-meta:/data
    networks:
      - matrix

  mautrix-messenger:
    # Le jumeau du service ci-dessus, à un tag près : `v26.08` nu, c'est le binaire
    # Messenger. Depuis cette version mautrix-meta ne fait plus qu'un réseau — d'où
    # deux conteneurs de la même image, deux bases, deux salons de gestion. Rien ne
    # se partage entre Instagram et Messenger, pas même la session Meta.
    image: dock.mau.dev/mautrix/meta:v26.08
    container_name: correspondance-mautrix-messenger
    restart: unless-stopped
    depends_on:
      - synapse
      - postgres
    environment:
      # Même entrypoint que les autres : chown /data puis su-exec vers l'UID de `meff`.
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data/mautrix-messenger:/data
    networks:
      - matrix

  mautrix-signal:
    # Tag épinglé comme les autres ponts. libsignal est compilé dans le binaire et
    # l'image embarque ffmpeg : ni signald, ni dépendance à installer à côté.
    image: dock.mau.dev/mautrix/signal:v26.08
    container_name: correspondance-mautrix-signal
    restart: unless-stopped
    depends_on:
      - synapse
      - postgres
    environment:
      # Même entrypoint que les autres : chown /data puis su-exec vers l'UID de `meff`.
      UID: "1000"
      GID: "1000"
    volumes:
      - ./data/mautrix-signal:/data
    networks:
      - matrix

  sygnal:
    # Le passe-plat entre Synapse et APNs. Il ne voit QUE le réseau Docker :
    # aucun `ports:`, donc rien de publié sur le tailnet. Synapse l'appelle par
    # son nom de service — http://sygnal:5000/_matrix/push/v1/notify.
    image: matrixdotorg/sygnal:latest
    container_name: correspondance-sygnal
    restart: unless-stopped
    depends_on:
      - synapse
    environment:
      SYGNAL_CONF: /config/sygnal.yaml
    volumes:
      - ./data/sygnal:/config:ro
      # La clé APNs (.p8) vit HORS du dépôt et hors de data/ : elle ne se
      # régénère pas, elle se retélécharge chez Apple (une fois, jamais deux).
      - ./secrets/apns:/secrets:ro
    networks:
      - matrix

  cloudflared-push:
    # Le tunnel qui rend la passerelle publique.
    #
    # Pourquoi un tunnel et pas un port ouvert : le NUC n'a ni 80 ni 443 libres
    # (Umbrel les tient), il est derrière une box, et une passerelle push doit
    # être joignable en HTTPS par des Relais qui ne sont pas sur le tailnet —
    # un Continuwuity posé par infra/relais/install.sh chez quelqu'un d'autre.
    # cloudflared sort en HTTPS vers Cloudflare : rien à ouvrir, rien à router.
    #
    # Le jeton porte à lui seul le compte, l'identifiant du tunnel et son secret.
    # Il vaut un accès : il vit dans le .env du NUC (chmod 600), jamais ici.
    # La configuration d'ingress (quel nom, quel chemin, quel service) est
    # stockée CHEZ Cloudflare, pas dans ce fichier — c'est ce qui permet de
    # restreindre la route à `^/_matrix/push/v1/notify$` et `^/health$` et de
    # rendre 404 sur tout le reste, sans redéployer quoi que ce soit ici.
    #
    # `profiles` : ce service ne démarre que sur demande explicite
    # (`docker-compose --profile push up -d cloudflared-push`). Sans jeton, il
    # tournerait en boucle d'échec, et une passerelle n'est pas requise pour que
    # la pile Matrix serve son propriétaire.
    profiles: ["push"]
    image: cloudflare/cloudflared:latest
    container_name: correspondance-cloudflared-push
    restart: unless-stopped
    depends_on:
      - sygnal
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${PUSH_TUNNEL_TOKEN:-}
    networks:
      # Le même réseau que Sygnal, et rien d'autre : le tunnel ne peut joindre
      # que `http://sygnal:5000`, pas Synapse ni Postgres.
      - matrix

networks:
  matrix:
    driver: bridge
